# Runs send-release-notifications.js, for free, without needing a
# Firebase Blaze plan upgrade or any other hosting - this is one
# option, not the only one; any host that can run Node on a schedule
# works the same way. Delete this file if you'd rather run it
# somewhere else (a Cloud Function + Cloud Scheduler, a cron job on a
# server you already have, etc).
#
# Before this will do anything, add three repository secrets (this
# repo's Settings -> Secrets and variables -> Actions -> New repository
# secret):
#   FIREBASE_SERVICE_ACCOUNT_JSON  - the full service account JSON, as one string
#   ONESIGNAL_APP_ID               - same value as ONESIGNAL_APP_ID in scripts/app.js
#   ONESIGNAL_REST_API_KEY         - from OneSignal dashboard -> Settings -> Keys & IDs
#
# Two schedules, not one - release notifications and engagement
# reminders (streak/Continue Watching) run at different times of day on
# purpose, not just because they're logically separate. Keeping real
# separation between the two - rather than both firing at 08:00 - means
# a "watch something today" reminder doesn't compete for attention with
# the same morning release check, and lands at a point in the day
# someone's meaningfully more likely to actually be looking at their
# phone than at 08:00 sharp. Both still only ever run once each, at
# their own time - every account is processed on the same single pass
# for whichever concern that run is for; there's still no per-account
# local-time targeting.
#
# GitHub tells the script which of the two schedules actually fired via
# github.event.schedule (passed through as TRIGGER_SCHEDULE below) - see
# the RUN MODE block near the top of send-release-notifications.js for
# how that's used. A manual run (workflow_dispatch) has no schedule
# value at all, so the script treats that as "run everything," which is
# what you want when testing by hand rather than only exercising half of
# it.
#
# Every account is processed on the same single run within each concern
# - there's no per-account local-time targeting anymore (that needed
# hourly runs to work at all, checking each account against its own
# local 8am hour - removed as unnecessary complexity). The practical
# effect: what local time a notification actually lands at now depends
# on how far an account's timezone sits from UTC - e.g. 08:00 UTC is
# late morning in most of Europe, the middle of the night on the US West
# Coast. Adjust the cron hours below if you'd rather anchor to different
# UTC times.

name: Send release notifications

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node send-release-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
