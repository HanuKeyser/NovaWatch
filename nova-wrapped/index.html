<script>
// Same shared localStorage key as the main app, so this page (opened
// in-app via the full-screen page overlay) always matches whatever theme
// is currently selected there, instead of always rendering light.
(function () {
    try {
        var saved = localStorage.getItem('novawatch-theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { /* localStorage unavailable - just default to light */ }
})();
</script>

<script>
// This page is normally loaded inside the main app's full-screen iframe
// overlay - closing it there means asking the parent (same-origin) to
// close that overlay, not navigating away. If it's ever opened directly
// (not embedded), window.parent === window, so this falls back to just
// sending them to the main app instead.
function closeThisOverlay() {
    if (window.parent && window.parent !== window && typeof window.parent.closePageOverlay === 'function') {
        window.parent.closePageOverlay();
    } else {
        window.location.href = 'https://www.novawatch.site/';
    }
}

/* =========================================================
   RELEASE GATE
   Wrapped unlocks 1 January 2027, 00:00 UTC. Before that, this page
   never touches Firebase at all - it's just the holding state below.
========================================================= */
const WRAPPED_RELEASE_MS = Date.UTC(2027, 0, 1, 0, 0, 0, 0);
const isReleased = Date.now() >= WRAPPED_RELEASE_MS;

const root = document.getElementById("wrappedRoot");

function renderComingSoon() {
    const msRemaining = WRAPPED_RELEASE_MS - Date.now();
    const daysRemaining = Math.max(0, Math.ceil(msRemaining / (24 * 60 * 60 * 1000)));

    root.innerHTML = `
        <div class="coming-soon-card">
            <div class="coming-soon-badge">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5L12 2z"/></svg>
            </div>
            <div class="coming-soon-eyebrow">Coming Soon</div>
            <div class="coming-soon-title">NovaWrapped</div>
            <p class="coming-soon-sub">A look back at everything you watched - total time, your most-watched show, your busiest month, and more.</p>
            <div class="coming-soon-date">
                <div class="coming-soon-date-value">January 1, 2027</div>
                <div class="coming-soon-date-label">00:00 UTC</div>
            </div>
            <div class="coming-soon-countdown">${daysRemaining} day${daysRemaining === 1 ? '' : 's'} to go</div>
        </div>
    `;
}

if (!isReleased) {
    renderComingSoon();
} else {
    initWrappedApp();
}

/* =========================================================
   RELEASED: FIREBASE + STATS (mirrors the logic that lived in the
   main app's index.html before Wrapped became its own page)
========================================================= */
function initWrappedApp() {
    const firebaseConfig = {
        apiKey: "AIzaSyCzUprsMVHt_-YHvLImvanTlTXsyQ9sqOU",
        authDomain: "novawatch-b3ccd.firebaseapp.com",
        projectId: "novawatch-b3ccd",
        storageBucket: "novawatch-b3ccd.firebasestorage.app",
        messagingSenderId: "836164657360",
        appId: "1:836164657360:web:b3de1169942816d0d27ed5",
        measurementId: "G-H6TMK6C7D0"
    };

    root.innerHTML = `<div class="state-card"><div class="state-title">Loading your Wrapped...</div></div>`;

    try {
        firebase.initializeApp(firebaseConfig);
    } catch (err) {
        console.error("Firebase init failed:", err);
        renderError();
        return;
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            renderSignedOut();
            return;
        }
        try {
            const librarySnap = await db.collection("users").doc(user.uid).collection("library").get();
            const library = librarySnap.docs.map(doc => doc.data());
            const accountCreatedAt = (user.metadata && user.metadata.creationTime)
                ? new Date(user.metadata.creationTime)
                : null;
            renderWrapped(library, accountCreatedAt);
        } catch (err) {
            console.error("Failed to load library for Wrapped:", err);
            renderError();
        }
    });
}

function renderSignedOut() {
    root.innerHTML = `
        <div class="state-card">
            <div class="state-title">Sign In to See Your Wrapped</div>
            <p class="state-sub">NovaWrapped is tied to your NovaWatch account. Sign in through the app, then come back here.</p>
            <a class="state-cta" href="https://www.novawatch.site/" target="_top">Open NovaWatch</a>
        </div>
    `;
}

function renderError() {
    root.innerHTML = `
        <div class="state-card">
            <div class="state-title">Couldn't Load Your Wrapped</div>
            <p class="state-sub">There was a problem reaching NovaWatch's servers. Check your connection and try reloading this page.</p>
        </div>
    `;
}

/* =========================================================
   STATS COMPUTATION
   Tracks Jan 1 - Dec 31 UTC for whichever year is selected. The first
   7 days after account creation are excluded from whichever year they
   fall in - new users tend to bulk-add a backlog of shows/movies
   they'd already watched long before joining, and counting that as
   real-time viewing would badly skew the recap.
========================================================= */
const WRAPPED_GRACE_PERIOD_MS = 7 * 24 * 60 * 60 * 1000;
const WRAPPED_MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

let wrappedLibrary = [];
let wrappedAccountCreatedAt = null;
let currentWrappedYear = null;

function getWrappedYearBounds(year) {
    return {
        start: new Date(Date.UTC(year, 0, 1, 0, 0, 0, 0)),
        end: new Date(Date.UTC(year, 11, 31, 23, 59, 59, 999))
    };
}

function getWrappedEffectiveStart(year) {
    const { start } = getWrappedYearBounds(year);
    if (!wrappedAccountCreatedAt) return start;
    const graceEnd = new Date(wrappedAccountCreatedAt.getTime() + WRAPPED_GRACE_PERIOD_MS);
    return graceEnd > start ? graceEnd : start;
}

function getWrappedYearMinMax() {
    const max = new Date().getUTCFullYear();
    const min = wrappedAccountCreatedAt ? wrappedAccountCreatedAt.getUTCFullYear() : max;
    return { min, max };
}

function computeWrappedStats(year) {
    const { end } = getWrappedYearBounds(year);
    const effectiveStart = getWrappedEffectiveStart(year);

    const inRange = (isoString) => {
        if (!isoString) return false;
        const d = new Date(isoString);
        return d >= effectiveStart && d <= end;
    };

    let totalMinutes = 0;
    let moviesCount = 0;
    let episodesCount = 0;
    const showEpisodeCounts = new Map();
    const monthMinutes = new Array(12).fill(0);

    wrappedLibrary.forEach(item => {
        if (item.type === 'movie') {
            if (item.watched && inRange(item.lastWatchedAt)) {
                const match = (item.runtime || "").match(/(\d+)/);
                const mins = match ? parseInt(match[1], 10) : 120;
                totalMinutes += mins;
                moviesCount++;
                monthMinutes[new Date(item.lastWatchedAt).getUTCMonth()] += mins;
            }
        } else if (item.episodes) {
            item.episodes.forEach(ep => {
                if (!ep.watched || !inRange(ep.watchedAt)) return;
                const match = (ep.runtime || "").match(/(\d+)/);
                const mins = match ? parseInt(match[1], 10) : 45;
                totalMinutes += mins;
                episodesCount++;
                monthMinutes[new Date(ep.watchedAt).getUTCMonth()] += mins;

                const existing = showEpisodeCounts.get(item.id);
                if (existing) {
                    existing.count++;
                } else {
                    showEpisodeCounts.set(item.id, { title: item.title, count: 1 });
                }
            });
        }
    });

    let topShow = null;
    showEpisodeCounts.forEach(show => {
        if (!topShow || show.count > topShow.count) topShow = show;
    });

    let busiestMonth = null;
    monthMinutes.forEach((mins, idx) => {
        if (mins > 0 && (!busiestMonth || mins > busiestMonth.minutes)) {
            busiestMonth = { label: WRAPPED_MONTH_NAMES[idx], minutes: mins };
        }
    });

    return {
        year,
        totalMinutes,
        days: Math.floor(totalMinutes / 1440),
        hours: Math.floor((totalMinutes % 1440) / 60),
        minutes: totalMinutes % 60,
        moviesCount,
        episodesCount,
        showsCount: showEpisodeCounts.size,
        topShow,
        busiestMonth,
        hasData: totalMinutes > 0
    };
}

function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

function renderWrapped(library, accountCreatedAt) {
    wrappedLibrary = library;
    wrappedAccountCreatedAt = accountCreatedAt;

    const { min, max } = getWrappedYearMinMax();
    // Default to the most recently *completed* year (a proper "recap"),
    // falling back to the current year if the account is younger than
    // that - e.g. someone who joined partway through the current year.
    currentWrappedYear = (max - 1 >= min) ? max - 1 : max;

    root.innerHTML = `
        <div class="wrapped-hero">
            <div class="wrapped-hero-title">NovaWrapped</div>
            <div class="wrapped-hero-sub">Everything you watched, one year at a time.</div>
        </div>
        <div class="wrapped-year-nav">
            <button class="year-nav-btn" id="wrappedYearPrev" aria-label="Previous year">
                <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="wrapped-year-label" id="wrappedYearLabel"></div>
            <button class="year-nav-btn" id="wrappedYearNext" aria-label="Next year">
                <svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
        <div id="wrappedBody"></div>
    `;

    document.getElementById("wrappedYearPrev").addEventListener("click", () => changeWrappedYear(-1));
    document.getElementById("wrappedYearNext").addEventListener("click", () => changeWrappedYear(1));

    renderWrappedYear();
}

function changeWrappedYear(delta) {
    const { min, max } = getWrappedYearMinMax();
    const next = currentWrappedYear + delta;
    if (next < min || next > max) return;
    currentWrappedYear = next;
    renderWrappedYear();
}

function renderWrappedYear() {
    const { min, max } = getWrappedYearMinMax();
    document.getElementById("wrappedYearLabel").textContent = currentWrappedYear;
    document.getElementById("wrappedYearPrev").disabled = currentWrappedYear <= min;
    document.getElementById("wrappedYearNext").disabled = currentWrappedYear >= max;

    const stats = computeWrappedStats(currentWrappedYear);
    const body = document.getElementById("wrappedBody");

    if (!stats.hasData) {
        const isCurrentYear = currentWrappedYear === new Date().getUTCFullYear();
        body.innerHTML = `
            <div class="state-card">
                <div class="state-title">Nothing Tracked Yet</div>
                <p class="state-sub" style="margin-bottom: 0;">No watch activity recorded for ${currentWrappedYear}${isCurrentYear ? " so far" : ""}.</p>
            </div>
        `;
        return;
    }

    body.innerHTML = `
        <div class="analytics-card" style="margin-top: 0;">
            <div class="analytics-main">
                <div class="analytics-icon-badge">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                    <div class="stat-label" style="text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;">Total Watch Time</div>
                    <div class="stat-value highlight">${stats.days} days, ${stats.hours} hours, ${stats.minutes} minutes</div>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <svg class="icon stat-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>
                    <div class="stat-value">${stats.showsCount}</div>
                    <div class="stat-label">TV Shows</div>
                </div>
                <div class="stat">
                    <svg class="icon stat-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M2 7l4-4h3l-4 4H2z"/><path d="M11 7l4-4h3l-4 4h-3z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                    <div class="stat-value">${stats.moviesCount}</div>
                    <div class="stat-label">Movies</div>
                </div>
                <div class="stat">
                    <svg class="icon stat-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <div class="stat-value">${stats.episodesCount}</div>
                    <div class="stat-label">Episodes</div>
                </div>
            </div>
        </div>

        ${stats.topShow ? `
        <div class="section-title">Most Watched Show</div>
        <div class="analytics-card" style="margin-top: 0;">
            <div class="analytics-main" style="border-bottom: none; padding-bottom: 0;">
                <div>
                    <div class="spotlight-title">${escapeHTML(stats.topShow.title)}</div>
                    <div class="stat-label">${stats.topShow.count} episode${stats.topShow.count === 1 ? '' : 's'} watched</div>
                </div>
            </div>
        </div>` : ''}

        ${stats.busiestMonth ? `
        <div class="section-title">Busiest Month</div>
        <div class="analytics-card" style="margin-top: 0;">
            <div class="analytics-main" style="border-bottom: none; padding-bottom: 0;">
                <div>
                    <div class="spotlight-title">${stats.busiestMonth.label}</div>
                    <div class="stat-label">${Math.round(stats.busiestMonth.minutes / 60)} hours watched</div>
                </div>
            </div>
        </div>` : ''}
    `;
}
</script>
</body>
</html>
